<!DOCTYPE html>
<html lang="en" class="h-full bg-[#F5F5F5] text-[#0A0A0A]">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/agap_pwa_icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="AGAP" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#902715" />
    <meta name="description" content="AGAP - Advance Guidance & Assistance Platform for Santa Rosa City" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Outfit:wght@400..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@400..700&family=Syne:wght@500..800&family=Unbounded:wght@400..900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Outfit:wght@400..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@400..700&family=Syne:wght@500..800&family=Unbounded:wght@400..900&display=swap" rel="stylesheet">
    </noscript>
    <title>AGAP - Santa Rosa Disaster Response</title>
  </head>
  <body class="h-full antialiased font-sans bg-[#F5F5F5] text-[#0A0A0A] selection:bg-[#902715] selection:text-white">
    <div id="app" class="h-full flex flex-col items-center justify-center min-h-screen bg-[#F5F5F5]">
      <!-- Instant Static PWA Loading Shell -->
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:system-ui, -apple-system, sans-serif; text-align:center;">
        <img src="/agap_pwa_icon.png" alt="AGAP" style="width:72px; height:72px; border-radius:18px; margin-bottom:16px; box-shadow:0 4px 12px rgba(144,39,21,0.25);" />
        <span style="font-size:22px; font-weight:900; letter-spacing:-0.03em; color:#902715;">AGAP SANTA ROSA</span>
        <span style="font-size:12px; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:#717171; margin-top:4px;">Disaster Response Network</span>
        <div style="margin-top:24px; width:32px; height:32px; border:3px solid #f3d3cd; border-top-color:#902715; border-radius:50%; animation:agap-spin 0.8s linear infinite;"></div>
      </div>
      <style>
        @keyframes agap-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
