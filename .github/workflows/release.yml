name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          # GITHUB_TOKEN may be blocked by repo/org settings from creating PRs.
          # If you see "not permitted to create or approve pull requests",
          # create a classic PAT (repo scope) at github.com/settings/tokens,
          # add it as RELEASE_PLEASE_TOKEN in repo → Settings → Secrets → Actions.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # ---- Build & attach assets only when a release is actually published ----
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run build
        if: ${{ steps.release.outputs.release_created }}

      - name: Upload build artifacts
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --clobber
